name: Deploy frontend to Azure Static Web Apps

# Builds the React frontend and deploys it to Azure Static Web Apps.
#
# Required GitHub repository secrets:
#   AZURE_STATIC_WEB_APPS_API_TOKEN - deployment token from the Azure Static
#                                      Web App resource (Portal -> your Static
#                                      Web App -> Overview -> Manage deployment
#                                      token). Scoped to this resource only.
#   REACT_APP_API_URL               - production backend URL, e.g.
#                                      https://task-manager-backend.azurewebsites.net
#   REACT_APP_GOOGLE_CLIENT_ID      - Google OAuth client ID (same one used
#                                      by the backend's GOOGLE_CLIENT_ID)
#
# CRA bakes REACT_APP_* variables into the JS bundle at build time, so they
# must be supplied as env vars to this workflow's build step.

on:
  push:
    branches:
      - task-manager
    paths:
      - "student_task_manager/frontend/**"
      - ".github/workflows/azure-static-web-apps.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - task-manager
    paths:
      - "student_task_manager/frontend/**"
  workflow_dispatch: {}

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "student_task_manager/frontend"
          output_location: "build"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request
    steps:
      - name: Close pull request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
